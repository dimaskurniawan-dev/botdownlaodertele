<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <!-- Import Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff; /* Putih Bersih */
            --text-main: #1a1a1a;
            --text-dim: #64748b;
            --accent: #000000; /* Hitam Solid untuk Kontras */
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-card {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }

        .system-label {
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        #timer {
            font-size: 56px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .btn-black {
            display: none;
            background-color: var(--accent);
            color: #ffffff;
            padding: 18px 48px;
            border-radius: 12px; /* Border radius modern */
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-black:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .security-footer {
            margin-top: 80px;
            font-size: 10px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="system-label">Cloud Verification</div>
        
        <div id="content-wrapper">
            <div id="timer">3</div>
            <h1>Menyiapkan Video</h1>
            <p>Hampir selesai, verifikasi keamanan sedang berjalan.</p>
        </div>

        <!-- Ganti NAMA_BOT_LO sesuai username bot lo -->
        <a href="https://t.me/tiktokdownloaderhigh_bot?start=VERIFIED" class="btn-black" id="action-btn">Lanjutkan ke Telegram</a>

        <div class="security-footer">Verified Connection</div>
    </div>

    <script>
        // Link Adsterra lo bang
        const adLink = "https://www.profitablecpmratenetwork.com/hgnqasba?key=ede47bd8ef264089dffa1f99688a598d";

        window.onclick = function() {
            window.open(adLink, '_blank');
            window.onclick = null; 
        };

        let count = 3;
        const timerDisplay = document.getElementById('timer');
        const actionBtn = document.getElementById('action-btn');
        const contentWrapper = document.getElementById('content-wrapper');

        const countdown = setInterval(() => {
            count--;
            timerDisplay.textContent = count;
            
            if (count <= 0) {
                clearInterval(countdown);
                contentWrapper.style.display = 'none';
                actionBtn.style.display = 'inline-block';
            }
        }, 1000);
    </script>
</body>
</html>
